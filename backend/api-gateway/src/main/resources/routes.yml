spring:
  cloud:
    gateway:
      routes:
        # ==========================================
        # 🏭 RUTAS DE SERVICIOS
        # ==========================================
        # --- USER SERVICE (Login, Register, Refresh) ---
        - id: auth-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - StripPrefix=2
        # --- AGGREGATION SERVICE ---
        # Ruta específica para LEER eventos (GET)
        - id: get-events
          uri: lb://AGGREGATION-SERVICE
          predicates:
            - Path=/api/v1/events
            - Method=GET
          filters:
            - StripPrefix=2

        # Ruta específica para LEER eventos de una colección (GET)
        - id: get-collection-events
          uri: lb://AGGREGATION-SERVICE
          predicates:
            - Path=/api/v1/collections/*/events
            - Method=GET
          filters:
            - StripPrefix=2

        # Ruta específica para LEER colecciones (GET)
        - id: get-collections
          uri: lb://AGGREGATION-SERVICE
          predicates:
            - Path=/api/v1/collections
            - Method=GET
          filters:
            - StripPrefix=2

        # Ruta específica para LEER una colección (GET)
        - id: get-collection
          uri: lb://AGGREGATION-SERVICE
          predicates:
            - Path=/api/v1/collections/*
            - Method=GET
          filters:
            - StripPrefix=2

        # Ruta específica para CREAR colecciones (POST)
        - id: post-collection
          uri: lb://AGGREGATION-SERVICE
          predicates:
            - Path=/api/v1/collections
            - Method=POST
          filters:
            - StripPrefix=2
            - AuthenticationFilter=ADMIN

        # Ruta específica para EDITAR colecciones (POST)
        - id: edit-collection
          uri: lb://AGGREGATION-SERVICE
          predicates:
            - Path=/api/v1/collections/*
            - Method=PUT
          filters:
            - StripPrefix=2
            - AuthenticationFilter=ADMIN

        # Ruta específica para ELIMINAR colecciones (DELETE)
        - id: delete-collection
          uri: lb://AGGREGATION-SERVICE
          predicates:
            - Path=/api/v1/collections/*
            - Method=DELETE
          filters:
            - StripPrefix=2
            - AuthenticationFilter=ADMIN

        # --- LEER todas las fuentes (GET) ---
        - id: get-sources
          uri: lb://AGGREGATION-SERVICE
          predicates:
            - Path=/api/v1/sources
            - Method=GET
          filters:
            - StripPrefix=2
            - AuthenticationFilter=ADMIN

        # --- LEER todas las categorías (GET) ---
        - id: get-categories
          uri: lb://AGGREGATION-SERVICE
          predicates:
            - Path=/api/v1/categories
            - Method=GET
          filters:
            - StripPrefix=2

        # --- LEER categoría por ID (GET) ---
        - id: get-category
          uri: lb://AGGREGATION-SERVICE
          predicates:
            - Path=/api/v1/categories/*
            - Method=GET
          filters:
            - StripPrefix=2

        # --- LEER provincias (GET) ---
        - id: get-provinces
          uri: lb://AGGREGATION-SERVICE
          predicates:
            - Path=/api/v1/locations/provinces
            - Method=GET
          filters:
            - StripPrefix=2

        # --- publicar solicitud de eliminación (POST) ---
        - id: post-deletion-request
          uri: lb://AGGREGATION-SERVICE
          predicates:
            - Path=/api/v1/deletion-request
            - Method=POST
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter
              args:
                required: false
                roles:
                  - CONTRIBUTOR

        # --- LEER todas las solicitudes de eliminación (GET) ---
        - id: get-all-deletion-requests
          uri: lb://AGGREGATION-SERVICE
          predicates:
            - Path=/api/v1/deletion-request
            - Method=GET
          filters:
            - StripPrefix=2
            - AuthenticationFilter=ADMIN

        # --- EVALUAR solicitud de eliminación (PUT) ---
        - id: evaluate-deletion-request
          uri: lb://AGGREGATION-SERVICE
          predicates:
            - Path=/api/v1/deletion-request/*
            - Method=PUT
          filters:
            - StripPrefix=2
            - AuthenticationFilter=ADMIN

        # --- STATIC SOURCE ---
        # Ruta específica para CREAR una FUENTE, IMPORT FROM CSV (POST)
        - id: post-source-csv
          uri: lb://STATIC-SOURCE
          predicates:
            - Path=/api/v1/sources
            - Method=POST
          filters:
            - StripPrefix=2
            - AuthenticationFilter=ADMIN
        # --- DYNAMIC SOURCE ---
        # Ruta específica para CREAR eventos (POST)
        - id: post-event
          uri: lb://DYNAMIC-SOURCE
          predicates:
            - Path=/api/v1/events
            - Method=POST
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter
              args:
                required: false
                roles:
                  - ADMIN
                  - CONTRIBUTOR

        # Ruta específica para EVALUAR subidas de eventos (PUT)
        - id: evaluate-event-submission
          uri: lb://DYNAMIC-SOURCE
          predicates:
            - Path=/api/v1/submissions/*
            - Method=PUT
          filters:
            - StripPrefix=2
            - AuthenticationFilter=ADMIN

        # --- LEER todas las solicitudes de subida (GET) ---
        - id: get-all-submission-requests
          uri: lb://DYNAMIC-SOURCE
          predicates:
            - Path=/api/v1/submissions
            - Method=GET
          filters:
            - StripPrefix=2
            - AuthenticationFilter=ADMIN

        # --- LEER todos los eventos de un usuario (GET) ---
        - id: get-user-events
          uri: lb://DYNAMIC-SOURCE
          predicates:
            - Path=/api/v1/users/me/events
            - Method=GET
          filters:
            - StripPrefix=2
            - AuthenticationFilter=CONTRIBUTOR

        # --- LEER todas las solicitudes de edicion (GET) ---
        - id: get-all-edition-requests
          uri: lb://DYNAMIC-SOURCE
          predicates:
            - Path=/api/v1/edition-requests
            - Method=GET
          filters:
            - StripPrefix=2
            - AuthenticationFilter=ADMIN

        # Ruta específica para EDITAR colecciones (POST)
        - id: post-edition-request
          uri: lb://DYNAMIC-SOURCE
          predicates:
              - Path=/api/v1/events/*
              - Method=PUT
          filters:
              - StripPrefix=2
              - AuthenticationFilter=CONTRIBUTOR

          # Ruta específica para EVALUAR solicitud de edicion (PUT)
        - id: evaluate-edition-request
          uri: lb://DYNAMIC-SOURCE
          predicates:
            - Path=/api/v1/edition-requests/*
            - Method=PUT
          filters:
            - StripPrefix=2
            - AuthenticationFilter=ADMIN

        - id: get-multimedia
          uri: lb://DYNAMIC-SOURCE
          predicates:
              - Path=/api/v1/multimedia/**
              - Method=GET
          filters:
              - StripPrefix=2
        # --- PROXY SOURCE ---
        # --- STATISTICS SERVICE ---
        - id: get-top-categories
          uri: lb://STATISTICS-SERVICE
          predicates:
            - Path=/api/v1/statistics/categories/top
            - Method=GET
          filters:
            - StripPrefix=2
            - AuthenticationFilter=ADMIN

        - id: get-top-provinces-by-category
          uri: lb://STATISTICS-SERVICE
          predicates:
            - Path=/api/v1/statistics/category/*/provinces/top
            - Method=GET
          filters:
            - StripPrefix=2
            - AuthenticationFilter=ADMIN

        - id: get-busiest-hours-by-category
          uri: lb://STATISTICS-SERVICE
          predicates:
            - Path=/api/v1/statistics/category/*/busiest-hours/top
            - Method=GET
          filters:
            - StripPrefix=2
            - AuthenticationFilter=ADMIN
        # ==========================================
        # 🧪 RUTAS DE TESTING (Self-Routing)
        # ==========================================
        # CASO 1: PÚBLICA (Sin autenticación)
        # Prueba: GET http://localhost:8086/test/case1
        # Esperado: 200 OK (JSON sin headers X-User-Id)
        - id: test-public
          uri: forward:/test/dump-headers
          predicates:
            - Path=/api/v1/test/public
          filters:
            - StripPrefix=2
            - SetPath=/test/dump-headers

        # CASO 2: AUTENTICADO (Cualquier Rol)
        # Esperado: 200 OK (JSON con headers X-User-Id)
        # Fallo: Si no mandas token -> 401
        - id: test-any-auth
          uri: forward:/test/dump-headers
          predicates:
            - Path=/api/v1/test/authenticated
          filters:
            - StripPrefix=2
            - AuthenticationFilter
            - SetPath=/test/dump-headers

        # CASO 3: SI O SI ADMIN
        # Esperado: 200 OK
        # Fallo: Token User/Contributor -> 403 Forbidden
        - id: test-admin-only
          uri: forward:/test/dump-headers
          predicates:
            - Path=/api/v1/test/admin-only
          filters:
            - StripPrefix=2
            - AuthenticationFilter=ADMIN
            - SetPath=/test/dump-headers

        # CASO 4: ADMIN "Y" CONTRIBUTOR (AND)
        # Esperado: Solo pasa si el usuario tiene AMBOS roles.
        - id: test-admin-and-contributor
          uri: forward:/test/dump-headers
          predicates:
            - Path=/api/v1/test/admin-and-contributor
          filters:
            - StripPrefix=2
            - AuthenticationFilter=CONTRIBUTOR
            - AuthenticationFilter=ADMIN
            - SetPath=/test/dump-headers

        # CASO 5: ADMIN "O" CONTRIBUTOR (OR)
        # Prueba: POST http://localhost:8086/test/case5
        - id: test-admin-or-contributor
          uri: forward:/test/dump-headers
          predicates:
            - Path=/api/v1/test/admin-or-contributor
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter
              args:
                roles:
                  - ADMIN
                  - CONTRIBUTOR
            - SetPath=/test/dump-headers

        # CASO 6: SOFT AUTH
        # Prueba A (Anónimo): GET http://localhost:8086/test/case6 -> 200 OK (Sin headers)
        # Prueba B (Auth): GET http://localhost:8086/test/case6 + Token -> 200 OK (Con headers)
        # Prueba C (Invalido): GET ... + Token Vencido -> 401 Unauthorized
        - id: test-optional-auth
          uri: forward:/test/dump-headers
          predicates:
            - Path=/api/v1/test/soft-auth
          filters:
            - StripPrefix=2
            - name: AuthenticationFilter
              args:
                required: false
                roles:
                  - ADMIN
                  - CONTRIBUTOR
            - SetPath=/test/dump-headers



