<th:block th:fragment="navbar">
    <header class="navbar" id="navbar">
        <div class="brand">
            <div class="brand-mark"><span class="dot"></span></div>
            <span class="brand-name">MetaMapa</span>
        </div>

        <div class="auth-actions">
            <button id="accountBtn" class="account-btn" type="button"
                    data-auth="open" data-panel="register">
                Registrarse
            </button>
            <button id="loginBtn" class="btn-outline" type="button"
                    data-auth="open" data-panel="login">
                Iniciar Sesión
            </button>
        </div>
    </header>

    <nav class="subnav" id="subnav">
        <a th:href="@{/explore}" class="active">Explorar</a>
        <a th:href="@{/collections}">Colecciones</a>
        <a th:href="@{/map}">Mapa</a>
    </nav>
</th:block>
