<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>MetaMapa - Layout Test</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Tus CSS compartidos -->
    <link th:href="@{/shared/css/tokens.css}" rel="stylesheet">
    <link th:href="@{/shared/css/base.css}" rel="stylesheet">
    <link th:href="@{/shared/css/components.css}" rel="stylesheet">
    <link th:href="@{/shared/css/utilities.css}" rel="stylesheet">

    <style>
        /* 🚧 Colores de prueba (para ver la estructura) */
        header { background: #cce5ff; padding: 1rem; text-align: center; }
        main   { background: #e2e3e5; padding: 2rem; min-height: 300px; text-align: center; }
        footer { background: #d4edda; padding: 1rem; text-align: center; }
    </style>
</head>
<body>

<!-- Header fijo -->
<header>
    <h1>Header</h1>
</header>

<!-- Main con slot -->
<main layout:fragment="content">
    <p>Contenido por defecto del layout</p>
</main>

<!-- Footer -->
<footer>
    <p>Footer</p>
</footer>

</body>
</html>
