<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${pageTitle} ?: 'MetaMapa'">MetaMapa</title>

    <!-- Fuente base (Poppins, pesos comunes del legacy) -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- CSS global (tokens + bootstrap + base/shared) -->
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}"/>
    <link rel="stylesheet" th:href="@{/css/tokens.css}"/>
    <link rel="stylesheet" th:href="@{/css/base.css}"/>
    <link rel="stylesheet" th:href="@{/css/components.css}"/>
    <link rel="stylesheet" th:href="@{/css/nav.css}"/>
    <link rel="stylesheet" th:href="@{/css/icons.css}"/>

    <!-- CSS específico de página -->
    <th:block layout:fragment="pageStyles"></th:block>
</head>
<body class="bg-body">

<!-- Header (fragment) -->
<header th:replace="fragments/_navbar :: navbar"></header>

<!-- MAIN: se inyecta la página -->
<main class="min-vh-100" layout:fragment="content"></main>

<!-- Footer (fragment) -->
<footer th:replace="fragments/_footer :: footer"></footer>

<!-- JS global -->
<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

<!-- Slot opcional para JS específico de página -->
<th:block layout:fragment="pageScripts"></th:block>
</body>
</html>
