<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8"/>

    <!-- CSRF Token -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title th:text="${pageTitle} ?: 'MetaMapa'"></title>

    <!-- Base font (Poppins) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>

    <!-- Tokens + Base + Shared -->
    <link rel="stylesheet" th:href="@{/css/global/main.css}">
    <link rel="stylesheet" th:href="@{/css/global/globalStyles.css}">
    <link rel="stylesheet" th:href="@{/css/shared/nav/nav.css}">
    <link rel="stylesheet" th:href="@{/css/shared/cards/media-grid.css}">


    <!-- Estílos específicos -->
    <th:block layout:fragment="extraStyles"></th:block>

</head>
<body>

<!-- Header (fragment) -->
<header>
    <th:block layout:fragment="navbar">
        <div th:replace="~{fragments/_navbar :: navbar}"></div>
    </th:block>
</header>

<!-- Contenido principal -->
<main>
    <th:block th:replace="~{${contenido} :: contenido}"></th:block>
</main>

<!-- Modales -->
<div id="main-form-modal"></div>
<div id="modals-here"></div>

<!-- Scripts globales -->
<script src="https://unpkg.com/htmx.org@1.9.12"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script th:src="@{/js/queryParamsGlobalManager.js}"></script>

<script th:src="@{/js/navbar/auth.js}"></script>
<script th:src="@{/js/navbar/curated-mode.js}"></script>

<script th:src="@{/js/video-lazy-load.js}"></script>

<!-- Scripts específicos de página -->
<th:block layout:fragment="extraScripts"></th:block>

<!--Script para inyectar token CSRF en el header de llamadas HTTP hechas por HTMX o fetch manuales (thymeleaf maneja solo los formularios automáticamente)-->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // 1. Obtener el token y el nombre del header de los meta tags
        const csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
        const csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');

        // 2. Configuración para HTMX (lo que usa la modal)
        if (typeof htmx !== 'undefined') {
            document.body.addEventListener('htmx:configRequest', function(evt) {
                evt.detail.headers[csrfHeader] = csrfToken;
            });
        }

        // 3. Interceptor global para 'fetch' (para JS vanilla)
        const originalFetch = window.fetch;
        window.fetch = function(url, config) {
            if (config && ['POST', 'PUT', 'DELETE', 'PATCH'].includes(config.method?.toUpperCase())) {
                config.headers = config.headers || {};
                config.headers[csrfHeader] = csrfToken;
            }
            return originalFetch(url, config);
        };
    });
</script>

<th:block layout:fragment="extraScripts"></th:block>

</body>
</html>
