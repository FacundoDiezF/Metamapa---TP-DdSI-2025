<html layout:decorate="~{layout/base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <th:block layout:fragment="extraStyles">
        <link rel="stylesheet" th:href="@{/css/shared/cards/card-collection.css}"/>
        <link rel="stylesheet" th:href="@{/css/pages/collections.css}"/>
    </th:block>
</head>

<div th:fragment="contenido" class="collections-page container-scroller">

    <header class="page-head" aria-label="Opciones de Colecciones">
        <h1 class="page-title">Colecciones</h1>
    </header>

    <section class="collections-list" role="region" aria-label="Listado">

        <p th:if="${#lists.isEmpty(collections)}" class="empty-msg">
            No hay colecciones disponibles.
        </p>

        <th:block th:unless="${#lists.isEmpty(collections)}">
            <th:block th:each="col : ${collections}">
                <article th:replace="~{fragments/_collectionCard :: collectionCard(collection=${col})}"></article>
            </th:block>
        </th:block>

    </section>

</div>
</html>
