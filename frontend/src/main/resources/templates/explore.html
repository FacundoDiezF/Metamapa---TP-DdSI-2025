<html layout:decorate="~{layout/base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<head>
    <th:block layout:fragment="extraStyles">
        <link rel="stylesheet" th:href="@{/css/pages/explore.css}"/>
        <link rel="stylesheet" th:href="@{/css/filters.css}"/>
    </th:block>
</head>

<div th:fragment="contenido" class="layout">

    <!-- Sidebar izquierda -->
    <aside th:replace="~{fragments/explore/_sidebar_left :: left}"></aside>

    <!-- Feed central (único con scroll) -->
    <section th:replace="~{fragments/explore/_explore_center}"></section>

    <!-- Sidebar derecha -->
    <aside th:replace="~{fragments/explore/_sidebar_rigth :: rigth}"></aside>

</div>

</html>
