<html layout:decorate="~{layout/base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<th:block layout:fragment="extraStyles">
    <link rel="stylesheet" th:href="@{/css/shared/grid-3col.css}"/>

    <!-- Página inCollection -->
    <link rel="stylesheet" th:href="@{/css/pages/inCollection.css}"/>

    <!-- SideBar izquierdo: filtros -->
    <link rel="stylesheet" th:href="@{/css/shared/filters/filters.css}"/>

    <!-- SideBar derecho: miniMapa + colecciones destacadas -->
    <link rel="stylesheet" th:href="@{/css/shared/sidebar-right/miniMap.css}"/>
    <link rel="stylesheet" th:href="@{/css/shared/sidebar-right/featured-collections.css}"/>

    <!-- Cards  -->
    <link rel="stylesheet" th:href="@{/css/shared/cards/card-event.css}"/>
</th:block>


<th:block th:fragment="contenido">
    <section th:replace="~{layout/grid3 :: grid3(
        ~{fragments/grid3/_sidebar_left :: filter-form(@{/collection/{handler}(handler=${collection.handler})})},
        ~{fragments/grid3/center/_inCollection_center :: center},
        ~{fragments/grid3/_sidebar_right :: right}
      )}"></section>
</th:block>

<th:block layout:fragment="extraScripts">
    <script th:inline="javascript">
        window.events = [[${events}]];
    </script>

    <script th:src="@{/js/map/metamapa-map.js}"></script>

    <script>
        initMetaMapa({
            containerId: 'explore-map',
            center: [-34.6037, -58.3816],
            zoom: 10,
            mini: true
        });

        window.focusMapOn = function(lat, lng) {
            const mapInstance = window.MetaMapa && window.MetaMapa['explore-map'];

            if (mapInstance && mapInstance.map) {
                // flyTo hace una animación suave. El '15' es el nivel de zoom (muy cerca)
                mapInstance.map.flyTo([lat, lng], 11, {
                    animate: true,
                    duration: 1.5 // Segundos que dura el "vuelo"
                });
            }
        };
    </script>
</th:block>

</html>
