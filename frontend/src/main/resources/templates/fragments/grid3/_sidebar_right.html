<aside th:fragment="right" class="sidebar-right">
    <div id="mm-mapa" class="collapse d-lg-block show">
        <div class="card map-box">
            <h3>Mapa</h3>
            <div class="map-frame">
                <div id="explore-map" data-mm-map class="map-canvas"></div>
            </div>
        </div>
    </div>

    <div class="card colecciones">
        <h3>Colecciones</h3>
        <ul>
            <li  th:each="col : ${collectionPage.content}" ><a class="refColeccion" th:href="@{/collection/{handler}(handler=${col.handler})}"  th:text="${col.title}"    >tituloColeccion</a> </li>
        </ul>
        <a th:href="@{/collections}"  class="btn-primary">Explorar Mas</a>
    </div>


</aside>
