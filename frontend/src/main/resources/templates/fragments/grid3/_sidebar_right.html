<aside th:fragment="right" id="mobile-sidebar-right" class="sidebar-right">

    <div class="sidebar-header-mobile">
        <h3>Mapa y Colecciones</h3>
        <button type="button" class="btn-close-sidebar" onclick="closeAllSidebars()">✕</button>
    </div>

    <div id="mm-mapa">
        <div class="card map-box">
            <h3 class="sidebar-header-desktop">Mapa</h3>
            <div class="map-frame">
                <div id="explore-map" data-mm-map class="map-canvas"></div>
            </div>
        </div>
    </div>

    <div th:if="${!#lists.isEmpty(collectionPage.content)}" class="card colecciones">
        <h3 class="sidebar-header-desktop">Colecciones</h3>
        <ul>
            <li th:each="col : ${collectionPage.content}">
                <a class="refColeccion"
                   th:href="@{/collection/{handler}(handler=${col.handler})}"
                   th:text="${col.title}">
                    Titulo Coleccion
                </a>
            </li>
        </ul>
        <a th:href="@{/collections}" class="btn-primary">Explorar Mas</a>
    </div>
</aside>
