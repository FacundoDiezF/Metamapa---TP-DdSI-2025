<section th:fragment="hechos" id="hechos" class="section" th:if="${not #lists.isEmpty(latestEvents)}">
    <div class="container">
        <div class="section-header">
            <h2 class="section-title">Hechos en Tiempo Real</h2>
            <p class="section-subtitle">Visualiza los reportes más recientes generados por la comunidad.</p>
        </div>

        <div class="facts-split">

            <div class="map-container">

                <div id="landing-map" style="width: 100%; height: 100%; min-height: 400px; z-index: 1;"></div>

                <div class="map-cta-overlay">
                    <a th:href="@{/map}" class="mm-btn mm-btn--primary">
                        + Ver mapa completo
                    </a>
                </div>
            </div>

            <div class="facts-list">
                <a th:each="ev : ${latestEvents}"
                   class="fact-item">

                    <div class="fact-info">
                        <h4 th:text="${#strings.abbreviate(ev.title, 40)}">Título del Hecho</h4>

                        <span th:text="${ev.location != null ? (ev.location.province + ', ' + ev.location.department + ', ' + ev.location.municipality ) : 'Ubicación no disponible'}">
                            Ubicación
                        </span>

                        <small th:text="${#temporals.format(ev.eventDate, 'dd/MM/yyyy')}">
                            Fecha
                        </small>
                    </div>
                </a>

                <a th:href="@{/explore}" class="mm-btn mm-btn--outline"
                   style="margin-top: 16px; width: 100%; justify-content: center;">
                    Ver todos los hechos
                </a>
            </div>
        </div>
    </div>
</section>
