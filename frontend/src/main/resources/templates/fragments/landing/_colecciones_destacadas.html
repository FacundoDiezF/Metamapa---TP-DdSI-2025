<section th:fragment="colecciones"
         th:if="${not #lists.isEmpty(topCollections)}"
         class="section collections-section">

    <div class="container">
        <div class="section-header">
            <h2 class="section-title">Colecciones Destacadas</h2>
            <p class="section-subtitle">Explora conjuntos de datos curados por organizaciones y usuarios verificados.</p>
        </div>

        <div class="cards-grid">
            <div th:each="collection : ${topCollections}" class="collection-card">

                <div class="card-accent"></div>

                <div class="card-content">
                    <div class="card-header-text">
                        <h5 th:text="${collection.title}">Título Colección</h5>
                        <p class="card-desc" th:text="${collection.description}">Descripción breve...</p>
                    </div>

                    <div class="card-footer-area">
                        <div class="meta-row">
                             <span class="count-badge">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
                                <span th:text="${collection.eventIds.size() + ' hechos'}">0 hechos</span>
                            </span>
                        </div>

                        <a th:href="@{/collection/{h}(h=${collection.handler})}"
                           class="mm-btn mm-btn--outline card-btn">
                            Ver Colección
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
