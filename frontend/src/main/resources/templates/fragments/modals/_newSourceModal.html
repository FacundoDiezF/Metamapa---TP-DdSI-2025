<!-- Modal de Creacion Coleccion -->
<div th:fragment="newSourceModal" class="modal-overlay"
     hx-on:click="if(event.target.classList.contains('modal-overlay')) { this.closest('#modals-here').innerHTML = '' }">

    <div class="modal-body" role="dialog" aria-modal="true">

        <button type="button"
                class="modal-close"
                aria-label="Cerrar"
                hx-on:click="this.closest('#modals-here').innerHTML = ''">
            ✕
        </button>

        <h2>Asociar una nueva fuente de datos</h2>
        <form method="POST">

            <div class="field">
                <label>Nombre de la fuente
                    <input name="name" type="text" placeholder="Nombre de la fuente" required/>
                </label>

                <p class="help error-msg">El nombre es obligatorio.</p>
            </div>

            <div class="field">
                <label>Path del API
                    <input name="title" type="text" placeholder="Path del nuevo modulo" required/>
                </label>
                <p class="help error-msg">La path es obligatorio.</p>
            </div>

            <button type="submit" class="btn-apply">Enviar</button>

        </form>
    </div>
</div>
