<!-- Modal “+ Más categorías” -->
<div th:fragment="categoriesModal"
     class="mm-overlay"
     role="dialog"
     aria-modal="true"
     hx-on:click="if(event.target.classList.contains('mm-overlay')) { this.closest('#modals-here').innerHTML = '' }">

    <div class="mm-modal">
        <button
                class="mm-close"
                aria-label="Cerrar"
                hx-on:click="this.closest('#modals-here').innerHTML = ''"
        >
            ✕
        </button>

        <h2 class="mm-title">Seleccionar categorías</h2>

        <div class="chips-box">
            <div class="chips">
                        <span th:each="cat : ${categoriesPage.content}" class="chip-toggle">

                            <input type="checkbox"
                                   th:id="'cat-modal:' + ${cat.id}"
                                   th:value="${cat.id}"

                                   th:checked="${categoriesSelected != null and categoriesSelected.contains(cat.id)}"

                                   hx-on:change="  var id = event.target.value;
                                                   var hiddenId = 'hidden-cat:' + id;
                                                   var container = document.getElementById('selected-categories-state');
                                                   var existing = document.getElementById(hiddenId);

                                                   if (event.target.checked) {
                                                       // Agregar campo oculto (solo si no existe)
                                                       if (!existing) {
                                                           var input = document.createElement('input');
                                                           input.type = 'hidden';
                                                           input.name = 'category_in';
                                                           input.value = id;
                                                           input.id = hiddenId;
                                                           container.appendChild(input);
                                                       }
                                                   } else {
                                                       // Eliminar campo oculto
                                                       if (existing) {
                                                           existing.remove();
                                                       }
                                                   }
                                               "
                            />
                            <label th:for="'cat-modal:' + ${cat.id}" class="chip" th:text="${cat.name}">
                                Nombre Tag Categoria
                            </label>
                        </span>
            </div>
        </div>
        <p class="help info">Seleccioná una o varias categorías.</p>

        <div class="mm-actions">

            <div class="pagination"
                 hx-target="#modals-here"
                 hx-swap="innerHTML">
                <button th:if="${!categoriesPage.first}"
                        th:hx-get="@{/modals/more-categories(page-cat=${categoriesPage.pageNumber - 1})}"
                        hx-include="#category-filter-form"
                        class="btn small">
                    Anterior
                </button>

                <span th:text="'Página ' + ${categoriesPage.pageNumber + 1} + ' de ' + ${categoriesPage.totalPages}"></span>

                <button th:if="${!categoriesPage.last}"
                        th:hx-get="@{/modals/more-categories(page-cat=${categoriesPage.pageNumber + 1})}"
                        hx-include="#category-filter-form"
                        class="btn small">
                    Siguiente
                </button>
            </div>

            <!--    Parte funcional, inputs invisibles para no perder los seleccionados tras la paginacion        -->
            <form id="category-filter-form" class="mm-actions-buttons" method="get">

                <div id="selected-categories-state">
                    <input type="hidden"
                           th:each="id : ${categoriesSelected}"
                           name="category_in"
                           th:value="${id}"
                           th:id="'hidden-cat:' + ${id}"
                    />
                </div>

                <button type="submit"
                        class="btn-apply"
                >Aplicar
                </button>
            </form>
        </div>
    </div>
</div>
