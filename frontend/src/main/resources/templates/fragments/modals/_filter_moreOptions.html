<!-- Modal “+ Más categorías” -->
<div th:fragment="categoriesModal"
     class="modal-overlay"
     role="dialog"
     aria-modal="true"
     hx-on:click="if(event.target.classList.contains('modal-overlay')) { this.closest('#modals-here').innerHTML = '' }"
     hx-on:htmx:load="initializeModalChips('category_in');">

    <div class="modal-body">
        <button
                class="modal-close"
                aria-label="Cerrar"
                hx-on:click="this.closest('#modals-here').innerHTML = ''"
        >
            ✕
        </button>

        <h2>Seleccionar categorías</h2>

        <div class="chips-box">
            <div class="chips" id="chips-container">
                        <span th:each="cat : ${categoriesPage.content}" class="chip-toggle">

                            <input type="checkbox"
                                   th:id="'cat-modal:' + ${cat.id}"
                                   th:value="${cat.id}"

                                   hx-on:change="FilterManager.toggleArrayFilterValue('category_in', event.target.value, event.target.checked);"
                            />
                            <label th:for="'cat-modal:' + ${cat.id}" class="chip" th:text="${cat.name}">
                                Nombre Tag Categoria
                            </label>
                        </span>
            </div>
        </div>
        <p class="help info">Seleccioná una o varias categorías.</p>

        <div class="actions-buttons">

            <div class="pagination"
                 hx-target="#modals-here"
                 hx-swap="innerHTML">
                <button th:if="${!categoriesPage.first}"
                        th:hx-get="@{/modals/more-categories(page-cat=${categoriesPage.pageNumber - 1})}"
                >
                    Anterior
                </button>

                <span th:text="'Página ' + ${categoriesPage.pageNumber + 1} + ' de ' + ${categoriesPage.totalPages}"></span>

                <button th:if="${!categoriesPage.last}"
                        th:hx-get="@{/modals/more-categories(page-cat=${categoriesPage.pageNumber + 1})}"
                >
                    Siguiente
                </button>
            </div>

            <button type="button"
                    class="btn-apply"
                    onclick="FilterManager.navigateWithFilters();"
            >
                Aplicar
            </button>
        </div>
    </div>
</div>
