<!-- Modal “+ Más Elementos de filtro” -->
<div th:fragment="moreOptionsFilterModal(itemsPage, elementName, filterKey, modalPagePath)"
     class="modal-overlay"
     role="dialog"
     aria-modal="true"
     hx-on:click="if(event.target.classList.contains('modal-overlay')) { this.closest('#modals-here').innerHTML = '' }"

     th:data-filter-key="${filterKey}"
     hx-on:htmx:load="initializeModalChips(this.getAttribute('data-filter-key'));">

    <div class="modal-body">
        <button
                class="modal-close"
                aria-label="Cerrar"
                hx-on:click="this.closest('#modals-here').innerHTML = ''"
        >
            ✕
        </button>

        <h2 th:text="'Seleccionar ' + ${elementName}"> Seleccionar elementName </h2>

        <div class="chips-box">
            <div class="chips" id="chips-container">
                        <span th:each="item : ${itemsPage.content}" class="chip-toggle">

                            <input type="checkbox"
                                   th:id="'item-modal:' + ${item.id}"
                                   th:value="${item.id}"

                                   hx-on:change="FilterManager.toggleArrayFilterValue(this.closest('[data-filter-key]').getAttribute('data-filter-key'), event.target.value, event.target.checked);"
                            />
                            <label th:for="'item-modal:' + ${item.id}" class="chip" th:text="${item.name}">
                                Nombre Tag Element
                            </label>
                        </span>
            </div>
        </div>
        <p class="help info">Seleccioná uno o varios para agregar a los filtros.</p>

        <div class="actions-buttons">

            <div class="pagination"
                 hx-target="#modals-here"
                 hx-swap="innerHTML">
                <button th:if="${!itemsPage.first}"
                        th:hx-get="@{${modalPagePath}(page-cat=${itemsPage.pageNumber - 1})}"
                >
                    Anterior
                </button>

                <span th:text="'Página ' + ${itemsPage.pageNumber + 1} + ' de ' + ${itemsPage.totalPages}"></span>

                <button th:if="${!itemsPage.last}"
                        th:hx-get="@{${modalPagePath}(page-cat=${itemsPage.pageNumber + 1})}"
                >
                    Siguiente
                </button>
            </div>

            <button type="button"
                    class="btn-apply"
                    onclick="FilterManager.navigateWithFilters();"
            >
                Aplicar
            </button>
        </div>
    </div>
</div>

<!-- Modal Seleccionar 1 categoria (Para newEvent) -->
<div th:fragment="oneChipElementModal(itemsPage, elementName, modalPagePath, targetContainer, renderMode, redirectBase, inputName)"
     class="modal-overlay"
     role="dialog"
     aria-modal="true"
     hx-on:click="if(event.target.classList.contains('modal-overlay')) { this.closest('#modals-here').innerHTML = '' }">

    <div class="modal-body">
        <button class="modal-close"
                aria-label="Cerrar"
                hx-on:click="this.closest('#modals-here').innerHTML = ''">
            ✕
        </button>

        <h2 th:text="'Seleccionar una ' + ${elementName}">Seleccionar</h2>

        <form th:hx-post="@{/category-input-fragment(renderMode=${renderMode}, redirectBase=${redirectBase}, inputName=${inputName})}"
              th:hx-target="${targetContainer}"
              hx-swap="innerHTML"
              hx-on:htmx:after-request="if(event.detail.successful) { document.getElementById('modals-here').innerHTML = '' }">

            <div class="chips-box">
                <div class="chips">
                    <span th:each="item : ${itemsPage.content}" class="chip-toggle">
                        <div>
                            <input type="radio" name="itemSelected"
                                   th:id="'item-modal:' + ${item.id}"
                                   th:value="|${item.id}::${item.name}|"
                                   required
                            />
                            <label th:for="'item-modal:' + ${item.id}" class="chip"
                                   th:text="${item.name}">
                                Nombre
                            </label>
                        </div>
                    </span>
                </div>
            </div>

            <p class="help info">Seleccioná una opción.</p>

            <div class="actions-buttons">
                <div class="pagination" hx-target="#modals-here" hx-swap="innerHTML">
                    <button th:if="${!itemsPage.first}"
                            th:hx-get="@{${modalPagePath}(page-cat=${itemsPage.pageNumber - 1}, targetContainer=${targetContainer}, renderMode=${renderMode}, redirectBase=${redirectBase}, inputName=${inputName})}">
                        Anterior
                    </button>

                    <span th:text="'Página ' + ${itemsPage.pageNumber + 1} + ' de ' + ${itemsPage.totalPages}"></span>

                    <button th:if="${!itemsPage.last}"
                            th:hx-get="@{${modalPagePath}(page-cat=${itemsPage.pageNumber + 1}, targetContainer=${targetContainer}, renderMode=${renderMode}, redirectBase=${redirectBase}, inputName=${inputName})}">
                        Siguiente
                    </button>
                </div>

                <button type="submit" class="btn-apply">Seleccionar</button>
            </div>

        </form>
    </div>
</div>

<!-- Diferent chips option for the modal -->

<th:block th:fragment="categoryBasicChip(catId, catName)">
    <input type="checkbox"
           name="category"
           th:id="'cat-modal:' + ${catId}"
           th:value="${catName}"
           checked
           required
    />
    <label th:for="'cat-modal:' + ${catId}" class="chip"
           th:text="${catName}">
        Categoría
    </label>
</th:block>

<th:block th:fragment="categoryBadgeForEdit(catId, catName)">
    <input type="hidden" name="category" th:value="${catName}"/>

    <span class="category-badge edit-trigger">
        <span th:text="${catName}">Nombre Categoria</span>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
            <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
    </span>
</th:block>

<th:block th:fragment="collectionConditionBadge(catId, catName, inputName)">

    <th:block th:with="safeId=${inputName.replace('[','-').replace(']','').replace('.','-')}">

        <input type="hidden" th:name="${inputName}" th:value="${catId}"/>

        <div class="badge-value-filled"
             th:id="'wrapper-' + ${safeId}"

             th:hx-get="@{/modals/one-category(targetContainer='#wrapper-' + ${safeId}, renderMode='collectionBadge', inputName=${inputName}, modalParentId='#main-form-modal')}"

             hx-target="#modals-here"
             hx-swap="innerHTML">

            <span th:text="${catName}">Categoría</span>

            <svg class="edit-icon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
        </div>

    </th:block>
</th:block>
