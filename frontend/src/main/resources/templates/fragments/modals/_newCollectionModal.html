<div th:fragment="newCollectionModal" class="modal-overlay"
     hx-on:click="if(event.target.classList.contains('modal-overlay')) { this.closest('#modals-here').innerHTML = '' }">

    <div class="modal-body modal-collection-size">

        <button type="button" class="modal-close"
                hx-on:click="this.closest('#modals-here').innerHTML = ''">✕
        </button>

        <h2 th:text="${isEditMode == true} ? 'Editar colección' : 'Crear nueva colección'">
            Crear nueva colección
        </h2>

        <form method="POST"
              th:action="${isEditMode == true} ? @{/share/collections/{h}(h=${handler})} : @{/share/collections}"
              th:object="${newCollection}"
              class="modal-form-flex">

            <div class="form-scrollable-area">

                <div class="field">
                    <label>Título <input type="text" th:field="*{title}" required/></label>
                </div>

                <div class="field">
                    <label>Descripción <textarea rows="3" th:field="*{description}" required></textarea></label>
                </div>

                <div>
                    <label class="field-label">Fuentes asociadas</label>
                    <div class="sources-chips-container">
                        <div class="source-grid">
                            <label th:each="src : ${sources}" class="source-option">
                                <input type="checkbox"
                                       th:field="*{sourceIds}"
                                       th:value="${src.id}"
                                       class="source-option-input"/>
                                <span class="source-option-label"
                                      th:text="${'C' + src.clientId + ' • S' + src.id + ' (' + src.type + ')'}"></span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="consensus-section">
                    <span>Algoritmo de consenso</span>
                    <div class="consensus-chips-group">
                        <label class="consensus-chip">
                            <input type="radio" th:field="*{consensusType}" value="" class="consensus-radio"/>
                            <span class="consensus-chip-label">ALL PASS</span>
                        </label>

                        <label class="consensus-chip"
                               th:each="algo : ${T(interfaz.grafica.ddsi.dtos.output.collection.ConsensusType).values()}">
                            <input type="radio" th:field="*{consensusType}" th:value="${algo}" class="consensus-radio"/>
                            <span class="consensus-chip-label"
                                  th:text="${#strings.replace(algo.name(), '_', ' ')}"></span>
                        </label>
                    </div>
                </div>

                <div class="conditions-section">
                    <div class="conditions-options">
                        <span>Condiciones de Pertenencia</span>

                        <div class="criteria-actions">
                            <button type="button" class="btn-xs-outline"
                                    hx-get="/new-collection/add-condition-row?type=TITLE"
                                    hx-vals="js:{index: document.querySelectorAll('.condition-item').length}"
                                    hx-target="#conditions-list"
                                    hx-swap="beforeend">+ Título
                            </button>

                            <button type="button" class="btn-xs-outline"
                                    hx-get="/new-collection/add-condition-row?type=CATEGORY"
                                    hx-vals="js:{index: document.querySelectorAll('.condition-item').length}"
                                    hx-target="#conditions-list"
                                    hx-swap="beforeend">+ Categoría
                            </button>

                            <button type="button" class="btn-xs-outline"
                                    hx-get="/new-collection/add-condition-row?type=FROM_DATE"
                                    hx-vals="js:{index: document.querySelectorAll('.condition-item').length}"
                                    hx-target="#conditions-list"
                                    hx-swap="beforeend">+ Fecha Desde
                            </button>

                            <button type="button" class="btn-xs-outline"
                                    hx-get="/new-collection/add-condition-row?type=TO_DATE"
                                    hx-vals="js:{index: document.querySelectorAll('.condition-item').length}"
                                    hx-target="#conditions-list"
                                    hx-swap="beforeend">+ Fecha Hasta
                            </button>
                        </div>
                    </div>

                    <div id="conditions-list" class="criteria-list-container">

                        <th:block th:if="${not #lists.isEmpty(newCollection.conditions)}">
                            <th:block th:each="cond, iterStat : *{conditions}">
                                <div th:replace="~{fragments/modals/_newCollectionModal :: conditionRow(condition=${cond}, idx=${iterStat.index})}"></div>
                            </th:block>
                        </th:block>

                    </div>
                </div>

            </div>
            <div class="modal-footer-fixed">
                <button type="submit" class="btn-apply"
                        th:text="${isEditMode == true} ? 'Guardar Cambios' : 'Crear Colección'">
                    Crear/Editar Colección
                </button>
            </div>

        </form>
    </div>
</div>

<div th:fragment="conditionRow" class="condition-item fade-in-up">

    <div class="condition-row-content">
        <input type="hidden"
               th:name="|conditions[${idx}].conditionType|"
               th:value="${condition.conditionType}">

        <span class="criteria-badge" th:text="${condition.conditionType}">TYPE</span>

        <th:block th:if="${condition.conditionType.name() == 'FROM_DATE' or condition.conditionType.name() == 'TO_DATE'}">
            <input type="date"
                   th:name="|conditions[${idx}].conditionValue|"
                   th:value="${condition.conditionValue}"
                   required class="input-sm"/>
        </th:block>

        <th:block th:if="${condition.conditionType.name() == 'TITLE'}">
            <input type="text"
                   th:name="|conditions[${idx}].conditionValue|"
                   th:value="${condition.conditionValue}"
                   placeholder="Palabra clave en el título"
                   required class="input-sm"/>
        </th:block>

        <th:block th:if="${condition.conditionType.name() == 'CATEGORY'}">
            <input type="text"
                   th:name="|conditions[${idx}].conditionValue|"
                   th:value="${condition.conditionValue}"
                   placeholder="ID de Categoría seleccionada"
                   required class="input-sm"/>
        </th:block>

        <button type="button" class="btn-icon-remove" onclick="this.closest('.condition-item').remove()">✕</button>
    </div>
</div>
