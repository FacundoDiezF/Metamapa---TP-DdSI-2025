<!-- Modal de Creacion Coleccion -->
<div th:fragment="newCollectoinModal" class="modal-overlay"
     hx-on:click="if(event.target.classList.contains('modal-overlay')) { this.closest('#modals-here').innerHTML = '' }">

    <div class="modal-body" role="dialog" aria-modal="true">

        <button type="button"
                class="modal-close"
                aria-label="Cerrar"
                hx-on:click="this.closest('#modals-here').innerHTML = ''">
            ✕
        </button>

        <h2>Crear una nueva colección</h2>
        <form method="POST">

            <div class="field">
                <label>Título
                    <input name="title" type="text" placeholder="Nombre de la colección" required/>
                </label>

                <p class="help error-msg">El título es obligatorio.</p>
            </div>

            <div class="field">
                <label>Descripción
                    <textarea name="description" rows="5" placeholder="Describe lo ocurrido…" required></textarea>
                </label>
                <p class="help error-msg">La descripción es obligatoria.</p>
                <p class="help info">Evitá datos personales. Sé claro y específico.</p>
            </div>

            <button type="submit" class="btn-apply">Enviar</button>

        </form>
    </div>
</div>
