<!-- Modal de confirmación -->
<div th:fragment="successeModal(title, desc)" class="modal-overlay"
     hx-on:click="if(event.target.classList.contains('modal-overlay')) { this.closest('#modals-here').innerHTML = '' }">

    <div class="modal-body message-modal" role="dialog" aria-modal="true">

        <button type="button"
                class="modal-close"
                aria-label="Cerrar"
                hx-on:click="this.closest('#modals-here').innerHTML = ''">
            ✕
        </button>

        <h2 th:text="${title}">Titulo succes</h2>
        <p class="muted" th:text="${desc}">
            Descripcion.
        </p>

        <a class="btn-apply"
           hx-on:click="this.closest('#modals-here').innerHTML = '' ">
            Entendido
        </a>
    </div>
</div>

<!-- Modal de Warning -->
<div th:fragment="warningModal(title, desc)" class="modal-overlay"
     hx-on:click="if(event.target.classList.contains('modal-overlay')) { this.closest('#modals-here').innerHTML = '' }">

    <div class="modal-body message-modal modal-warning" role="dialog" aria-modal="true">

        <button type="button" class="modal-close" aria-label="Cerrar"
                hx-on:click="this.closest('#modals-here').innerHTML = ''">✕
        </button>

        <h2 th:text="'⚠️ ' + ${title}">Titulo del error</h2>
        <p class="muted" th:text="${desc}">Descripcion del error.</p>

        <a class="btn-apply" role="button"
           hx-on:click="this.closest('#modals-here').innerHTML = '' ">
            Entendido
        </a>
    </div>
</div>

<!-- Modal de Error -->
<div th:fragment="errorModal(title, desc)" class="modal-overlay"
     hx-on:click="if(event.target.classList.contains('modal-overlay')) { this.closest('#modals-here').innerHTML = '' }">

    <div class="modal-body message-modal modal-error" role="dialog" aria-modal="true">

        <button type="button" class="modal-close" aria-label="Cerrar"
                hx-on:click="this.closest('#modals-here').innerHTML = ''">✕
        </button>

        <h2 th:text="'‼️Error: ' + ${title}">Codigo de error</h2>
        <p class="muted" th:text="${desc}">Mensaje del error.</p>

        <a class="btn-apply" role="button"
           hx-on:click="this.closest('#modals-here').innerHTML = '' ">
            Entendido
        </a>
    </div>
</div>
