<!-- templates/map.html -->
<html th:replace="~{layout/base :: html}" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="contenido">
    <div th:replace="~{components/_subnav :: subnav('map')}"></div>

    <section class="container py-3">
        <h1 class="h3 mb-3">Mapa</h1>
        <div id="map" style="height: 520px; border-radius: 12px;"></div>
    </section>

    <th:block th:remove="tag">
        <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script>
            (function(){
                const el = document.getElementById('map');
                if (el && window.L) {
                    const m = L.map('map').setView([-34.6037, -58.3816], 11);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
                        { maxZoom: 19 }).addTo(m);
                }
            })();
        </script>
    </th:block>
</div>
</html>
