<div th:fragment="authModals">
    <!-- Modal Login (dummy) -->
    <div class="modal fade" id="authLoginModal" tabindex="-1" aria-labelledby="authLoginLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">

                <div class="modal-header">
                    <h1 class="modal-title fs-5" id="authLoginLabel">Iniciar sesión</h1>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>

                <div class="modal-body">
                    <!-- Contenido dummy (sin lógica) -->
                    <form novalidate>
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label">Email</label>
                            <input id="loginEmail" type="email" class="form-control" placeholder="nombre@ejemplo.com">
                        </div>
                        <div class="mb-3">
                            <label for="loginPass" class="form-label">Contraseña</label>
                            <input id="loginPass" type="password" class="form-control" placeholder="••••••••">
                        </div>
                    </form>
                    <small class="text-muted d-block mt-2">Demo: este formulario es solo ilustrativo.</small>
                </div>

                <div class="modal-footer">
                    <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button class="btn btn-primary">Entrar</button>
                </div>

            </div>
        </div>
    </div>
</div>
