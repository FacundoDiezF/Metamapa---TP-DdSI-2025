<article class="hecho card" th:fragment="cardFragment(item)" th:attr="data-sumission-id=${item.id}">

    <span class="tag" th:text="${item.event.category}">
        Categoria
    </span>
    <h2 th:text="${item.event.title}">
        Titulo del Hecho
    </h2>
    <p class="ubicacion">
        <span th:text="${#temporals.format(item.event.eventDate, 'dd MMMM yyyy')}"> EventDate </span>
    </p>
    <p th:text="${item.event.description}">
        Descripción del hecho muy buena descripcion la verdad que me gusta mucho este hecho
        que paso y que es muy interesante y que deberian saber todos los usuarios de
    </p>


    <p class="fuente" th:text="${item.event.Origin} + ' • ' + ${item.event.sourceId}">
        Static • Nombre de la fuente
    </p>

    <div class="card-actions">
        <form th:action="@{'/admin/events/approve/' + ${item.id}}" method="post">
            <button type="submit" class="btn-approve">Aceptar</button>
        </form>

        <form th:action="@{'/admin/events/reject/' + ${item.id}}" method="post">
            <button type="submit" class="btn-reject">Rechazar</button>
        </form>
    </div>


</article>
