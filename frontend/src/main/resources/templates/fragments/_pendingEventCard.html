<article class="hecho card" th:fragment="cardFragment(sub)" th:attr="data-sumission-id=${sub.id}">

    <span class="tag" th:text="${sub.event.category}">
        Categoria
    </span>
    <h2 th:text="${sub.event.title}">
        Titulo del Hecho
    </h2>
    <p class="ubicacion">
        <span th:text="${#temporals.format(sub.event.eventDate, 'dd MMMM yyyy')}"> EventDate </span>
    </p>
    <p th:text="${sub.event.description}">
        Descripción del hecho muy buena descripcion la verdad que me gusta mucho este hecho
        que paso y que es muy interesante y que deberian saber todos los usuarios de
    </p>

    <p class="fuente" th:text="${sub.event.Origin} + ' • ' + ${sub.event.sourceId}">
        Static • Nombre de la fuente
    </p>


    <!-- Aceptar o Rechazar -->
    <div class="card-actions">
        <form th:action="@{/share/submission-request/evaluate/{id}(id=${sub.id}, approve=true)}" method="post">
            <button type="submit" class="btn-approve">Aceptar</button>
        </form>

        <form th:action="@{/share/submission-request/evaluate/{id}(id=${sub.id}, approve=false)}" method="post">
            <button type="submit" class="btn-reject">Rechazar</button>
        </form>
    </div>
</article>
