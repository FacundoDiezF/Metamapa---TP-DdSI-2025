<article class="collection-card" th:fragment="collectionCard(collection)">

    <div class="card-head">
        <h2 class="card-title">
            <a th:href="@{/collection/{handler}(handler=${collection.handler})}"
               th:text="${collection.title}">Título</a>
        </h2>

        <div class="top-actions" sec:authorize="hasRole('ADMIN')">
            <button class="icon-btn" title="Editar">
                <img src="/shared/icons/edit.svg" alt="Editar">
            </button>
            <button class="icon-btn" title="Eliminar">
                <img src="/shared/icons/trash.svg" alt="Eliminar">
            </button>
        </div>
    </div>

    <p class="card-desc" th:text="${collection.description}">Descripción de la colección...</p>

    <div class="card-footer">

        <div class="card-meta">
            <img class="meta-icon" src="/shared/icons/location-pin-svgrepo-com.svg" alt=""/>
            <span th:text="${#lists.size(collection.eventIds)} + ' hechos'">0 hechos</span>
        </div>

        <a class="btn btn-outline"
           th:href="@{/collection/{handler}(handler=${collection.handler})}">
            Ver Colección
        </a>
    </div>

</article>
