<aside class="sidebar card" th:fragment="filters" xmlns:th="">
    <h3>Filtros</h3>
    <form class="filters" method="get" action="">

        <!-- CATEGORÍA -->
        <details class="flt" open>
            <summary class="flt-head">
                <span class="flt-title">Categoría</span><span class="caret" aria-hidden="true">▾</span>
            </summary>
            <div class="flt-body chips chips-wrap">
        <span class="chip-toggle">
          <input type="checkbox" id="c-gasoducto" name="categoria[]" value="gasoducto">
          <label for="c-gasoducto" class="chip">Gasoducto</label>
        </span>
                <!-- ... agregar más del legacy -->
            </div>
        </details>

        <!-- UBICACIÓN -->
        <details class="flt">
            <summary class="flt-head">
                <span class="flt-title">Ubicación</span><span class="caret" aria-hidden="true">▾</span>
            </summary>
            <div class="flt-body">
                <div class="ubic-searchbar">
                    <input id="ubic-search" name="ubicacion_text" type="search" placeholder="Buscar ubicación…" list="ubic-sugeridas" autocomplete="off">
                    <datalist id="ubic-sugeridas">
                        <option value="CABA"><option value="Ciudad de Córdoba"><option value="Rosario">
                    </datalist>
                </div>
            </div>
        </details>

        <!-- FECHA -->
        <details class="flt">
            <summary class="flt-head">
                <span class="flt-title">Fecha</span><span class="caret" aria-hidden="true">▾</span>
            </summary>
            <div class="flt-body">
                <label class="field">Desde<input type="date" name="desde"></label>
                <label class="field">Hasta<input type="date" name="hasta"></label>
            </div>
        </details>

        <div class="flt-actions">
            <button type="reset" class="btn">Limpiar</button>
            <button type="submit" class="btn primary">Aplicar</button>
        </div>
    </form>
</aside>
