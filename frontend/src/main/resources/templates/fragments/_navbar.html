<th:block th:fragment="navbar" xmlns:sec="http://www.w3.org/1999/xhtml">
    <div class="navbar" id="navbar">
        <a th:href="@{/explore}" class="brand">
            <div class="brand-mark"><span class="dot"></span></div>
            <span class="brand-name">MetaMapa</span>
        </a>
        <div class="auth-actions">
            <!-- Botón modo curado pequeño -->
            <div class="curated-toggle-wrapper">
                <button id="curatedModeBtn" class="curated-toggle" type="button" title="Activar/Desactivar Modo Curado">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/>
                    </svg>
                </button>
                <div id="curatedModeTooltip" class="curated-tooltip" hidden>
                    <span class="tooltip-text">Modo Normal</span>
                </div>
            </div>
            <!-- Botones de registro e inicio de sesión -->
            <div sec:authorize="!isAuthenticated()" style="display: flex; gap: 10px;">
                <a th:href="@{/register}" class="btn-primary btn-rounded" style="text-decoration: none;">
                    Registrarse
                </a>
                <a th:href="@{/login}" class="btn-bordered btn-rounded" style="text-decoration: none;">
                    Iniciar Sesión
                </a>
            </div>


            <div sec:authorize="isAuthenticated()" style="display: flex; align-items: center; gap: 10px;">

                <span style="font-size: 0.9rem; font-weight: 500;">
                    Hola, <span sec:authentication="name">Usuario</span>
                </span>

                <form th:action="@{/logout}" method="post" style="margin: 0;">
                    <button type="submit" class="btn-bordered btn-rounded"
                            style="border-color: #ff4d4f; color: #ff4d4f; background: transparent; cursor: pointer;">
                        Cerrar Sesión
                    </button>
                </form>

            </div>

        </div>
    </div>

    <!-- Barra de navegación secundaria -->
    <nav class="subnav" id="subnav">
        <a th:href="@{/explore}" th:classappend="${active}=='explore' ? ' active'">Explorar</a>
        <a th:href="@{/collections}" th:classappend="${active}=='collections' ? ' active'">Colecciones</a>
        <a th:href="@{/map}" th:classappend="${active}=='map' ? ' active'">Mapa</a>
        <a th:href="@{/admin/collections}" th:classappend="${active}=='admin' ? 'active'" sec:authorize="hasRole('ADMIN')">Panel de control</a>

    </nav>
</th:block>
