<main class="feed" th:fragment="feedHome" xmlns:th="">


    <!-- Si NO está logueado: CTA -->
    <section class="card" th:if="${#request.userPrincipal == null}">
        <h3>Bienvenido a MetaMapa</h3>
        <p>Iniciá sesión para compartir un hecho y participar.</p>
        <div class="auth-actions">
            <button class="btn primary" type="button" data-bs-toggle="modal" data-bs-target="#loginModal">Iniciar sesión</button>
            <button class="btn btn-outline-primary" type="button" data-bs-toggle="modal" data-bs-target="#registerModal">Registrarse</button>
        </div>
    </section>

    <!-- Si está logueado: panel compartir -->
    <details class="share" th:if="${#request.userPrincipal != null}">
        <summary id="shareSummary" class="card post-box" role="button" aria-controls="sharePanel">
            <input type="text" placeholder="Comparte tus hechos..." readonly/>
            <div class="post-icons" aria-hidden="true">
                <button type="button" class="post-icon" aria-label="Adjuntar imagen">
                    <img th:src="@{/shared/img/Icons/imagesmode.svg}" alt="">
                </button>
            </div>
        </summary>

        <form id="sharePanel" class="share-panel" method="post" action="#" novalidate>
            <div class="share-row">
                <label class="field"><span>Título</span><input id="titulo" name="titulo" type="text" required/></label>
                <label class="field"><span>Fecha</span><input id="fecha" name="fecha" type="date" required/></label>
            </div>
            <label class="field"><span>Descripción</span>
                <textarea id="descripcion" name="descripcion" minlength="50" placeholder="Contá lo sucedido…"></textarea>
            </label>
            <div class="share-actions">
                <button type="submit" class="btn primary">Publicar</button>
            </div>
        </form>
    </details>

    <!-- Ejemplos (mock del legacy) -->
    <article class="hecho card">
        <a class="flag-float" href="#" aria-label="Reportar">
            <img th:src="@{/shared/img/Icons/ci_flag.svg}" alt="" class="icon-img">
        </a>
        <span class="tag">Estallido de gasoducto</span>
        <h2>Impacto en comunidad de Paraná, Entre Ríos</h2>
        <p class="ubicacion">Paraná, Entre Ríos | 5 May 2025</p>
        <img src="https://images.unsplash.com/photo-1520975922284-7b683d5a5f0d?q=80&w=1400&auto=format&fit=crop" alt="Incidente"/>
        <p class="fuente">Static • Nombre de la fuente</p>
    </article>
</main>
