<html layout:decorate="~{layout/base}" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">

<!-- CSS propio (se inyecta en el <head> del base) -->
<th:block layout:fragment="extraStyles">
    <link rel="stylesheet" th:href="@{/css/shared/filters/filters.css}"/>
    <link rel="stylesheet" th:href="@{/css/pages/mapa.css}"/>

</th:block>


<div th:fragment="contenido" class="map-layout">

    <!-- BOTON MOBILE -->
    <div class="mobile-actions-bar">
        <button class="btn-open-sidebar" onclick="toggleSidebarLeft()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="21" x2="4" y2="14"></line><line x1="4" y1="10" x2="4" y2="3"></line><line x1="12" y1="21" x2="12" y2="12"></line><line x1="12" y1="8" x2="12" y2="3"></line><line x1="20" y1="21" x2="20" y2="16"></line><line x1="20" y1="12" x2="20" y2="3"></line><line x1="1" y1="14" x2="7" y2="14"></line><line x1="9" y1="8" x2="15" y2="8"></line><line x1="17" y1="16" x2="23" y2="16"></line></svg>
            Filtros
        </button>
    </div>

    <!-- Mapa -->
    <aside th:replace="~{fragments/grid3/_sidebar_left :: filter-form(@{/map})}"></aside>

    <section class="map-wrap">
        <div id="map" aria-label="Mapa de hechos"></div>
    </section>

    </div>

<th:block layout:fragment="extraScripts">
    <!-- 1) Inyecta los datos del modelo en JS -->
    <script th:inline="javascript">
        window.events = [[${eventsPage.getContent()}]];
    </script>

    <script th:src="@{/js/map/metamapa-map.js}"></script>

    <script>
        // Mapa grande
        initMetaMapa({
            containerId: 'map',
            center: [-34.6037, -58.3816],
            zoom: 5,
            mini: false
        });
    </script>
</th:block>
</html>
