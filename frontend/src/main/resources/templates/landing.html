<!DOCTYPE html>
<html layout:decorate="~{layout/base}"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <title>MetaMapa - Mapeo Colaborativo</title>
    <th:block layout:fragment="extraStyles">
        <link rel="stylesheet" th:href="@{/css/pages/landing.css}"/>
    </th:block>
</head>

<body>

<div th:fragment="contenido" class="landing-page">

    <section class="hero-section">
        <div class="container hero-grid">
            <div class="hero-content">
                <h1 class="animate-fade-up">Conectamos hechos,<br><span>Creamos verdad.</span></h1>
                <p class="tagline">La plataforma colaborativa para visualizar, organizar y compartir información
                    geográfica con impacto social.</p>

                <div class="hero-actions">
                    <a th:href="@{/explore}" class="mm-btn mm-btn--primary">Explorar Hechos</a>
                    <a sec:authorize="!isAuthenticated()" th:href="@{/login}" class="mm-btn mm-btn--outline">Iniciar Sesión</a>
                </div>
            </div>

            <div class="hero-image">
                <img th:src="@{/shared/img/landing_metamapa.png}"
                     alt="Interfaz de MetaMapa mostrando visualización de datos">
            </div>
        </div>
    </section>

    <section th:replace="~{fragments/landing/_proposito :: proposito}"></section>

    <section th:replace="~{fragments/landing/_colecciones_destacadas :: colecciones}"></section>

    <section th:replace="~{fragments/landing/_hechos_destacados :: hechos}"></section>

    <div th:replace="~{fragments/landing/_footer_landing :: footer}"></div>

</div>

</body>

<th:block layout:fragment="extraScripts">

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script th:inline="javascript">
        // Inyectamos la lista de eventos que trajo el Controller
        window.events = [[${latestEvents}]];
        console.log('Landing -> window.events:', window.events);
    </script>

    <script th:src="@{/js/map/metamapa-map.js}"></script>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            // Verificamos que existan eventos para no romper el mapa vacío
            if (window.events && window.events.length > 0) {
                initMetaMapa({
                    containerId: 'landing-map',
                    center: [-34.6037, -58.3816],
                    zoom: 5,
                    mini: false
                });
            }
        });
    </script>
</th:block>

</html>
