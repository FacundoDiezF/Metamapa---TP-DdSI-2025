<th:block th:fragment="adminStatisticsContent">

    <section class="admin-section">

        <header class="page-header">
            <div class="header-text">
                <h1 class="page-title">Estadísticas</h1>
                <p class="page-subtitle">Visualización y análisis agregado del uso del sistema.</p>
            </div>
        </header>

        <div class="admin-scroll-area">

            <div class="stats-grid">

                <section class="stat-card"
                         th:with="max=${TopProvincesOnCollection != null and !#lists.isEmpty(TopProvincesOnCollection) ? (TopProvincesOnCollection[0].occurrences != null ? TopProvincesOnCollection[0].occurrences : 1): 1}">
                    <header class="stat-head">
                        <h3 class="stat-title">Hechos por Provincia</h3>
                    </header>

                    <ol class="stat-list">
                        <li class="stat-item" th:each="s : ${TopProvincesOnCollection}"
                            th:with="val=${s.occurrences ?: 0}, pct=${max > 0 ? (val * 100.0) / max : 0}">
                            <span class="label" th:text="${s.entityName}">Provincia</span>
                            <div class="bar">
                                <span class="bar-fill" th:style="'width:' + ${#numbers.formatDecimal(pct,1,3)} + '%;'"></span>
                            </div>
                            <span class="value" th:text="${val}">0</span>
                        </li>
                    </ol>
                </section>

                <section class="stat-card"
                         th:with="max=${topCategories != null and !#lists.isEmpty(topCategories) ? (topCategories[0].occurrences ?: 1) : 1}">
                    <header class="stat-head">
                        <h3 class="stat-title">Hechos por Categoría</h3>
                    </header>

                    <ol class="stat-list">
                        <li class="stat-item" th:each="s : ${topCategories}"
                            th:with="val=${s.occurrences ?: 0}, pct=${max > 0 ? (val * 100.0) / max : 0}">
                            <span class="label" th:text="${s.entityName}">Cat</span>
                            <div class="bar">
                                <span class="bar-fill" th:style="'width:' + ${#numbers.formatDecimal(pct,1,3)} + '%;'"></span>
                            </div>
                            <span class="value" th:text="${val}">0</span>
                        </li>
                    </ol>
                </section>

                <section class="stat-card"
                         th:with="max=${TopProvincesByCategory != null and !#lists.isEmpty(TopProvincesByCategory) ? (TopProvincesByCategory[0].occurrences ?: 1): 1}">
                    <header class="stat-head">
                        <h3 class="stat-title">Provincias (filtrado)</h3>
                    </header>
                    <ol class="stat-list">
                        <li class="stat-item" th:each="s : ${TopProvincesByCategory}"
                            th:with="val=${s.occurrences ?: 0}, pct=${max > 0 ? (val * 100.0) / max : 0}">
                            <span class="label" th:text="${s.entityName}">Prov</span>
                            <div class="bar">
                                <span class="bar-fill" th:style="'width:' + ${#numbers.formatDecimal(pct,1,3)} + '%;'"></span>
                            </div>
                            <span class="value" th:text="${val}">0</span>
                        </li>
                    </ol>
                </section>

                <section class="stat-card"
                         th:with="max=${topHours != null and !#lists.isEmpty(topHours)? (topHours[0].occurrences ?: 1) : 1}">
                    <header class="stat-head">
                        <h3 class="stat-title">Horas Pico</h3>
                    </header>
                    <ol class="stat-list">
                        <li class="stat-item" th:each="s : ${topHours}"
                            th:with="val=${s.occurrences ?: 0}, pct=${max > 0 ? (val * 100.0) / max : 0}">
                            <span class="label" th:text="${s.entityName}">Hora</span>
                            <div class="bar">
                                <span class="bar-fill" th:style="'width:' + ${#numbers.formatDecimal(pct,1,3)} + '%;'"></span>
                            </div>
                            <span class="value" th:text="${val}">0</span>
                        </li>
                    </ol>
                </section>

            </div>

            <div style="height: 2rem;"></div>

        </div>
    </section>
</th:block>
