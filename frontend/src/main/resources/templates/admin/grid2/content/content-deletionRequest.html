<th:block th:fragment="deletionRequestContent">
    <section>

        <h1 class="admin-page-title">
            Solicitudes de eliminación
            <span class="count" th:text="${deletionsRequestsPage.totalElements}"></span>
        </h1>


        <div th:if="${#lists.isEmpty(deletionsRequestsPage.content)}">
            <strong>
                No hay solicitudes pendientes.
            </strong>
        </div>

        <ul class="deletion-list" th:if="${!#lists.isEmpty(deletionsRequestsPage.content)}">
            <li th:each="req : ${deletionsRequestsPage.content}">
                <article class="deletion-wrapper">
                    <!-- Card de evento  -->
                    <section class="deletion-extra">
                        <strong>Hecho reportado:</strong>
                        <div class="event-card-host">
                            <div th:replace="~{fragments/_eventCard.html :: cardFragment(${req.event})}"></div>
                        </div>

                        <!-- Motivo del reporte -->
                        <div class="extra-motive" th:if="${req.argument != null}">
                            <strong>Motivo del reporte:</strong>
                            <p th:text="${req.argument}">
                            </p>
                        </div>
                    </section>

                    <!-- Aceptar o eliminar -->
                    <div class="extra-actions">
                        <form th:action="@{/share/deletion-request/evaluate/{id}(id=${req.id}, approve=true)}" method="post">
                            <button type="submit" class="btn-approve">Aceptar</button>
                        </form>
                        <form th:action="@{/share/deletion-request/evaluate/{id}(id=${req.id}, approve=false)}" method="post">
                            <button type="submit" class="btn-reject">Rechazar</button>
                        </form>
                    </div>
                </article>
            </li>
        </ul>
    </section>
</th:block>
