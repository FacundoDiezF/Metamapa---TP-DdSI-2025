<th:block th:fragment="pendingEventsContent">
    <section>

        <h1 class="admin-page-title">
            Hechos Pendientes
            <span class="count" th:text="${eventsPage.totalElements}"></span>
        </h1>

        <div id="events-container" class="scroll-container">
            <th:block th:if="${#lists.isEmpty(eventsPage.content)}">
                <p class="no-events-msg">No hay Eventos disponibles.</p>
            </th:block>

            <th:block th:if="${!#lists.isEmpty(eventsPage.content)}" th:each="event : ${eventsPage.content}">
                <div th:replace="~{fragments/_pendingEventCard :: cardFragment(item=${event})}"></div>
            </th:block>
        </div>

    </section>
</th:block>
