<th:block th:fragment="pendingEventsContent">
    <section class="admin-section">

        <header class="page-header">
            <div class="header-text">
                <h1 class="page-title">
                    Hechos Pendientes
                    <span class="count" th:text="${submissionPage.totalElements}">0</span>
                </h1>
                <p class="page-subtitle">Revisá y aprobá las sugerencias de la comunidad.</p>
            </div>
        </header>

        <div class="admin-scroll-area">

            <div class="empty-state" th:if="${#lists.isEmpty(submissionPage.content)}">
                <p>No hay Eventos disponibles.</p>
            </div>

            <div id="events-container"
                 class="admin-list-container"
                 th:if="${!#lists.isEmpty(submissionPage.content)}">

                <th:block th:each="submission : ${submissionPage.content}">
                    <div th:replace="~{admin/cards/_pendingEventCard :: cardFragment(sub=${submission})}"></div>
                </th:block>
            </div>
        </div>
    </section>
</th:block>
