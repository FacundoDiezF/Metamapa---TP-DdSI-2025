<article class="event-card edit-request-card"
         th:fragment="editRequestCard(req)"
         th:attr="data-request-id=${req.id}">

    <header class="card-header">
        <span class="category-badge"
              th:classappend="${#lists.contains(req.modifiedFields, 'category')} ? 'modified-field'"
              th:attr="data-original-value=${#lists.contains(req.modifiedFields, 'category')} ? 'Antes: ' + ${req.event.category} : ''"
              th:text="${req.newCategory}">
            Categoria Nueva
        </span>

        <span class="request-id-badge">#<span th:text="${req.id}"></span></span>
    </header>

    <div class="card-body">

        <h3 class="event-title"
            th:classappend="${#lists.contains(req.modifiedFields, 'title')} ? 'modified-field'"
            th:attr="data-original-value=${#lists.contains(req.modifiedFields, 'title')} ? 'Antes: ' + ${req.event.title} : ''"
            th:text="${req.newTitle}">
            Titulo Nuevo
        </h3>

        <div class="event-meta">

            <span class="meta-date"
                  th:classappend="${#lists.contains(req.modifiedFields, 'eventDate')} ? 'modified-field'"
                  th:attr="data-original-value=${#lists.contains(req.modifiedFields, 'eventDate')} ? 'Antes: ' + ${#temporals.format(req.event.eventDate, 'dd/MM/yyyy')} : ''">

                <svg class="meta-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2"
                                                                                                          x2="16"
                                                                                                          y2="6"></line><line
                        x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>

                <span th:text="${#temporals.format(req.newEventDate, 'dd MMMM yyyy')}">
                    Fecha Nueva
                </span>
            </span>

            <span class="meta-separator">|</span>

            <span class="meta-location"
                  th:classappend="${#lists.contains(req.modifiedFields, 'latitude') or #lists.contains(req.modifiedFields, 'longitude')} ? 'modified-field'"
                  th:attr="data-original-value=${#lists.contains(req.modifiedFields, 'latitude') or #lists.contains(req.modifiedFields, 'longitude')} ? 'Antes: ' + ${#numbers.formatDecimal(req.event.latitude,1,4)} + ', ' + ${#numbers.formatDecimal(req.event.longitude,1,4)} : ''">

                <svg class="meta-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12"
                                                                                                              cy="10"
                                                                                                              r="3"></circle></svg>

                <span th:text="${#numbers.formatDecimal(req.newLatitude, 1, 4)} + ', ' + ${#numbers.formatDecimal(req.newLongitude, 1, 4)}">
                    -34.1234, -58.1234
                </span>

                <a th:href="@{'https://www.google.com/maps?q=' + ${req.newLatitude} + ',' + ${req.newLongitude}}"
                   target="_blank" class="arrow-icon-map" title="Ver en Mapa">↗</a>
            </span>

        </div>

        <p class="event-description"
           th:classappend="${#lists.contains(req.modifiedFields, 'description')} ? 'modified-field'"
           th:attr="data-original-value=${#lists.contains(req.modifiedFields, 'description')} ? 'Antes: ' + ${req.event.description} : ''"
           th:text="${req.newDescription}">
            Descripción Nueva...
        </p>
    </div>

    <div class="card-footer-info">
        <p class="source-info" th:text="${req.event.Origin} + ' • ' + ${req.event.sourceId}">
            SOURCE • ID
        </p>
    </div>

    <div class="admin-actions">
        <form th:action="@{/admin/edits/{id}/approve(id=${req.id})}" method="post" class="action-form">
            <button type="submit" class="btn-action accept">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                Aceptar
            </button>
        </form>

        <form th:action="@{/admin/edits/{id}/reject(id=${req.id})}" method="post" class="action-form">
            <button type="submit" class="btn-action reject">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                Descartar
            </button>
        </form>
    </div>

</article>
