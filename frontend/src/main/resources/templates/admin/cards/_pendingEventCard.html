<article class="event-card" th:fragment="cardFragment(sub)" th:attr="data-sumission-id=${sub.id}">

    <header class="card-header">
        <span class="category-badge" th:text="${sub.event.category}">
            Categoria
        </span>
        <span class="request-id-badge">#<span th:text="${sub.id}"></span></span>
    </header>

    <div class="card-body">
        <h3 class="event-title" th:text="${sub.event.title}">
            Titulo del evento
        </h3>

        <div class="event-meta">
            <span class="meta-date">
                <svg class="meta-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2"
                                                                                                          x2="16"
                                                                                                          y2="6"></line><line
                        x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                <span th:text="${#temporals.format(sub.event.eventDate, 'dd MMMM yyyy')}">
                    DD MMMM AAAA
                </span>
            </span>

            <span class="meta-location"
                  th:if="${sub.event.latitude != null and sub.event.longitude != null}">

                <span class="meta-separator">|</span>

                <svg class="meta-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                     stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12"
                                                                                                              cy="10"
                                                                                                              r="3"></circle></svg>

                <span th:text="${#numbers.formatDecimal(sub.event.latitude, 1, 4)} + ', ' + ${#numbers.formatDecimal(sub.event.longitude, 1, 4)}">
                    -34.1234, -58.1234
                </span>

                <a th:href="@{'https://www.google.com/maps/search/?api=1&query=' + ${sub.event.latitude} + ',' + ${sub.event.longitude}}"
                   target="_blank"
                   title="Ver en Mapa"
                   class="arrow-icon-map"
                >↗</a>
            </span>
        </div>

        <p class="event-description" th:text="${sub.event.description}">
            Descripción del hecho...
        </p>
    </div>

    <div class="card-footer-info">
        <p class="source-info" th:text="${sub.event.Origin} + ' • ' + ${sub.event.sourceId}">
            SOURCE • ID
        </p>
    </div>

    <div class="admin-actions">
        <form th:action="@{/share/submission-request/evaluate/{id}(id=${sub.id}, approve=true)}" method="post"
              class="action-form">
            <button type="submit" class="btn-action accept">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
                Aceptar
            </button>
        </form>

        <form th:action="@{/share/submission-request/evaluate/{id}(id=${sub.id}, approve=false)}" method="post"
              class="action-form">
            <button type="submit" class="btn-action reject">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
                Rechazar
            </button>
        </form>
    </div>

</article>
