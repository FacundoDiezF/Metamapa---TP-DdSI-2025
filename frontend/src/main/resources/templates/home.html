<!-- templates/pages/home.html -->
<html th:replace="~{layout/base :: html}" xmlns:th="http://www.thymeleaf.org">
<div th:fragment="contenido">
    <!-- CSS específico de la grilla -->
    <link rel="stylesheet" href="/css/pages/home.css"/>

    <!-- Inyecto el componente grid3 pasando mis 3 fragmentos -->
    <div th:replace="~{components/grid3 :: grid3(
        ~{fragments/_filters :: filters},         /* left  */
        ~{fragments/_feed-home :: feedHome},      /* center*/
        ~{fragments/_map :: map}                  /* right */
  )}"></div>

    <!-- Scripts de página-->
    <script src="/js/home/auth.js"></script>

    <!-- Leaflet -->
    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
          integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
          crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""></script>
    <script>
        (function(){
            var mapEl = document.getElementById('map');
            if (mapEl && window.L) {
                var map = L.map('map').setView([-34.6037, -58.3816], 11);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19, attribution: '&copy; OpenStreetMap'
                }).addTo(map);
            }
        })();
    </script>
</div>
</html>
