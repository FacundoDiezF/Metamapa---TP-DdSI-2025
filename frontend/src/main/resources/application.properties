spring.application.name=interfaz
server.port=8085

logging.level.org.thymeleaf=DEBUG
logging.level.org.thymeleaf.templateresolver=DEBUG
logging.level.org.thymeleaf.TemplateEngine.CONFIG=DEBUG

server.forward-headers-strategy=framework

# File upload configuration (max file size)
spring.servlet.multipart.max-file-size=50MB

# Backend services URLs
aggregator.url=http://localhost:8080
api.gateway.url=http://localhost:8086
static-source.url=http://localhost:8083